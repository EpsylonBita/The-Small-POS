[package]
name = "the-small-pos"
version = "1.4.76"
description = "The Small POS - Desktop point-of-sale (Tauri v2)"
authors = ["The Small Team <dev@thesmall.app>"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "the_small_pos_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
# Reproduces the pre-bridge founder-lab behavior. Never enable in production:
# a passive Caller ID observer returning 486 can terminate an HT813 PSTN call.
callerid-unsafe-legacy-busy-rejection = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
base64 = "0.22"

[dependencies]
# Tauri v2 core
tauri = { version = "2.11.5", features = [
  "tray-icon",
] }
tauri-plugin-updater = "2.10.1"

# Native folder picker for the invoice-capture watched-folder source
# (`.claude/specs/invoice-scan-capture/` D-UI, R3.1). The JS half
# (`@tauri-apps/plugin-dialog`) was already a package.json dependency but the
# Rust plugin was never registered, so every `open()` call failed at runtime;
# this declares it and `lib.rs` registers it. Version pinned to the JS
# package's major/minor so the two halves stay in lockstep.
#
# The capability grant in `capabilities/default.json` is deliberately narrow —
# `dialog:allow-open` only. No save dialog, no message/ask/confirm dialogs: the
# capture flow picks a folder and nothing else, and the file is an explicit
# union rather than a wildcard on purpose.
tauri-plugin-dialog = "2.7.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ring = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
rusttype = "0.9"

# SQLite (bundled so no system dep needed)
rusqlite = { version = "0.32", features = ["bundled", "trace"] }

# HTTP client (for admin dashboard API)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }

# Secure credential storage (replaces Electron safeStorage)
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

# PIN hashing
bcrypt = "0.16"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# ID generation
uuid = { version = "1", features = ["v4", "serde"] }
md5 = "0.7"

# Compression for sync payloads
zstd = "0.13"
flate2 = "1"
sha2 = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Diagnostics export (zip bundle)
zip = { version = "2", default-features = false, features = ["deflate"] }

# Serial port (scales, serial barcode scanners, customer displays)
serialport = "4"

# Secure memory clearing for secrets
zeroize = "1"

# Error handling
thiserror = "2"
anyhow = "1"
webbrowser = "1.0"

# URL encoding (W11 Item 7 deferred follow-up). Replaces the hand-rolled
# `.replace()` chain in `core_helpers::build_admin_query::enc()` with the
# RFC 3986-compliant `url::form_urlencoded::byte_serialize`. Already present
# transitively via reqwest; this declares it as a direct dep so we can `use`
# it without depending on reqwest's transitive surface.
url = "2"

# Filesystem change notifications for the invoice-capture watched-folder source
# (`capture::watcher`, spec `.claude/specs/invoice-scan-capture/` D-Rust3 / D5).
# Events are only ever a *wake-up hint*: the watcher also runs an unconditional
# 10 s poll sweep, because `ReadDirectoryChangesW` notifications are unreliable
# on the SMB/network shares MFPs scan into — exactly the deployment this source
# exists for. Default features only; no new platform backends.
notify = "6"

[target.'cfg(windows)'.dependencies]
dunce = "1.0.5"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Printing",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# COM/IDispatch bindings for the WIA Automation layer that drives connected
# scanners (`capture::wia`, spec `.claude/specs/invoice-scan-capture/` D-Rust2 /
# D4). `windows-sys` above stays exactly as it is — it exposes raw C bindings
# with no COM interface support, and `IDispatch` needs the vtable types only the
# full `windows` crate generates. Already in the lockfile transitively, so this
# adds no new crate.
#
# `Win32_System_Com` brings `IDispatch` + `CoInitializeEx`; `IDispatch::Invoke`
# is additionally gated behind `Win32_System_Ole` (which also carries
# `DISPID_PROPERTYPUT`) and `Win32_System_Variant` (`VARIANT`). Three features,
# no more — every extra one is generated code in every Windows build.
windows = { version = "0.61", features = [
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
] }

# WebView2 COM interfaces for `memory_trim` — the periodic
# SetMemoryUsageTargetLevel call that forces the browser to collect Blink-side
# garbage (see src/memory_trim.rs for the measured story). Already in the
# lockfile transitively through tauri-runtime-wry at this exact version, so
# this adds no new crate; it only lets our code name ICoreWebView2_19.
webview2-com = "0.38"

[dev-dependencies]
# Test-level serialization for tests that touch process-global state (OS keyring
# via storage::set_credential, etc.). Prevents flaky failures caused by parallel
# test threads racing on the same global resource.
serial_test = "3"

# Wave 5 Session 7 PR 1 — AST walker for the legacy-producer seal test at
# tests/w5_s7_legacy_producer_seal.rs. `syn` parses each `src/**/*.rs` file so
# the seal can skip `#[cfg(test)]` / `#[test]` subtrees instead of
# false-positiving on the test fixtures that deliberately seed the legacy
# `sync_queue` table (those fixtures pin the dual-queue transitional-reader
# contract during the bake window before migration v56 drops the table).
# `proc-macro2` with `span-locations` makes `Span::start().line` return real
# source positions so failure messages are actionable.
syn = { version = "2", features = ["full", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
